<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Valerie ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
</head>

<body>
    <div class="background-container">
        <!-- Background image is set in CSS -->
    </div>

    <div class="overlay"></div>

    <div id="petals-container"></div>

    <main class="content-wrapper">
        <div class="card glass-effect">
            <header>
                <h1 class="fade-in-up">Para Valerie</h1>
            </header>

            <div class="image-frame fade-in-up delay-1">
                <img src="assets/flower.png" alt="Tulipán para ti" class="hero-flower">
            </div>

            <article class="dedication-text fade-in-up delay-2">
                <p>En el jardín de mi vida, tú eres la flor más hermosa.</p>
                <p>Cada pétalo de este tulipán representa un momento feliz a tu lado. Gracias por iluminar mis días con
                    tu sonrisa.</p>
                <p class="highlight">Te Amo, Valerie ❤️</p>
            </article>

            <button id="love-btn" class="pulse-btn fade-in-up delay-3">Click para ver magia ✨</button>
        </div>
    </main>

    <div id="modal-message" class="modal hidden">
        <div class="letter-content">
            <span class="close-btn">&times;</span>
            <div class="letter-texture"></div>
            <h2>Mi Promesa</h2>
            <div class="letter-body">
                <p id="typewriter-text"></p>
                <span class="cursor">|</span>
            </div>

            <div class="polaroid-gallery">
                <div class="polaroid" style="transform: rotate(-3deg);">
                    <img src="assets/mi_princesa.jpeg" alt="Me encantas">
                    <div class="caption">Me encantas</div>
                </div>
                <div class="polaroid" style="transform: rotate(2deg);">
                    <img src="assets/mi_princesa2.jpeg" alt="Mi Favorita">
                    <div class="caption">Te adoro</div>
                </div>
                <div class="polaroid" style="transform: rotate(-1deg);">
                    <img src="assets/mi_princesa3.jpeg" alt="Tú">
                    <div class="caption">Eres Hermosa</div>
                </div>
            </div>
            <img src="assets/snoopy.png" alt="Snoopy con amor" class="snoopy-img">
            <div class="hearts-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
